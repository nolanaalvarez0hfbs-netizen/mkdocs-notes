version: 2.1

jobs:
  g1_go-live:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: water jet
          command: |
            mkdir -p /tmp/share
            set +o pipefail 2>/dev/null; yes abc | head -n 530430 | sha1sum > /tmp/share/step-19.log; true
            du -h /tmp/share/step-19.log
      - persist_to_workspace:
          root: /tmp/share
          paths:
            - step-19.log
  go-live:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/share
      - run:
          name: Confirm handoff
          command: |
            grep -c . /tmp/share/final.log || true
      - run:
          name: Pull project
          command: git clone --depth 2 -q --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Expand sources
          command: tar -xj -f cache.tar.bz2
      - run:
          no_output_timeout: 15m
          command: sleep 90
      - run:
          no_output_timeout: 60m
          command: taskset -c 0-3 ./kernel
  audit_fix-dashboard:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
